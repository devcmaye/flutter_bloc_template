name: flutter_bloc_template
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

    # Networking
  flutter_bloc: ^8.1.1
  dio: ^5.11.1
  equatable: ^2.0.5
  dartz: ^0.10.1
